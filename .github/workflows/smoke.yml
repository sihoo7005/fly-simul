name: smoke
on:
  push:
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -q
      - run: python simulate.py --target left --duration 0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fly-simul-smoke
          path: results/*.csv
